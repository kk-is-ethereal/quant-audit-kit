<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#131E3A"/>
      <stop offset="100%" stop-color="#080D1B"/>
    </radialGradient>
    <linearGradient id="gateGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="18%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="82%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <filter id="amberBlur" x="-100%" y="-20%" width="300%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyanBlur" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Subtle outer & inner geometric hexagon prism -->
  <polygon points="256,112 380,184 380,328 256,400 132,328 132,184"
           fill="none" stroke="#33486E" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="256,144 352,200 352,312 256,368 160,312 160,200"
           fill="none" stroke="#263859" stroke-width="2" stroke-linejoin="round"/>
  <line x1="256" y1="112" x2="256" y2="144" stroke="#33486E" stroke-width="2"/>
  <line x1="256" y1="368" x2="256" y2="400" stroke="#33486E" stroke-width="2"/>
  <line x1="132" y1="184" x2="160" y2="200" stroke="#263859" stroke-width="1.8"/>
  <line x1="380" y1="184" x2="352" y2="200" stroke="#263859" stroke-width="1.8"/>
  <line x1="132" y1="328" x2="160" y2="312" stroke="#263859" stroke-width="1.8"/>
  <line x1="380" y1="328" x2="352" y2="312" stroke="#263859" stroke-width="1.8"/>

  <!-- Noisy raw signal (left) -->
  <polyline points="104,256 122,256 130,236 138,274 148,224 158,284 168,214 178,278 188,232 198,274 208,204 220,294 232,226 242,272 250,248 256,256"
            fill="none" stroke="#38BDF8" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanBlur)"/>

  <!-- Purified smooth signal (right) -->
  <path d="M 256 256 C 272 204, 294 204, 310 256 C 326 308, 348 308, 364 256 C 374 224, 386 224, 394 256 L 408 256"
        fill="none" stroke="#38BDF8" stroke-width="4.2" stroke-linecap="round" filter="url(#cyanBlur)"/>

  <!-- Glowing amber statistical gate / zero-leakage threshold -->
  <rect x="252.5" y="160" width="7" height="192" rx="3.5" fill="url(#gateGlow)" filter="url(#amberBlur)"/>
</svg>
